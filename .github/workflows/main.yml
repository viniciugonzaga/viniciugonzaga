name: generate animation

on:
  # Roda automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"
  
  # Permite rodar manualmente a qualquer hora
  workflow_dispatch:
  
  # Roda em todo push no branch master
  push:
    branches:
    - master
    

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            # CORREÇÃO DEFINITIVA: Força o vermelho e as cores de fundo.
            # color_dots: Tons de cinza/preto para a grade (simulando dark mode).
            # color_snake: A cor Vermelha (#B30000) forçada.
            dist/github-contribution-grid-snake-dark.svg?color_dots=#161B22,#21262D,#30363D,#484F58,#6E7681&color_snake=#B30000
          
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
